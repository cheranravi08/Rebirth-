<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity Calorie Tracker</title>
  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>

  <div class="sheet-container">
    <!-- Header Controls -->
    <header class="sheet-header">
      <div class="header-logo">
        <div class="logo-symbol">▲</div>
        <div class="logo-text">
          <h1>ANTIGRAVITY</h1>
          <span>CYBER-SHEET LOG</span>
        </div>
      </div>
      
      <div class="calibration-controls">
        <div class="control-group">
          <label for="sheet-maintenance-input">Maintenance Calorie</label>
          <input type="number" id="sheet-maintenance-input" value="2500" placeholder="e.g. 2500">
        </div>
        <div class="control-group">
          <label for="sheet-target-input">Target Calorie</label>
          <input type="number" id="sheet-target-input" value="1500" placeholder="e.g. 1500">
        </div>
        <button class="btn btn-save" id="btn-save-sheet">Save Logs</button>
      </div>
    </header>

    <!-- Spreadsheet Section -->
    <main class="sheet-grid-wrapper">
      <div class="grid-table-container">
        <table class="cyber-sheet">
          <thead>
            <tr>
              <th style="width: 100px;">date / month</th>
              <th style="min-width: 320px;">food</th>
              <th style="width: 120px;">calorie</th>
              <th style="width: 120px;">proteins</th>
              <th style="width: 140px;">deficit kcal</th>
              <th style="width: 130px;">target calorie</th>
              <th style="width: 155px;">maintenance calorie</th>
            </tr>
          </thead>
          <tbody id="sheet-rows-tbody">
            <!-- Dynamic rows will be generated here from July 16 to Sept 30 -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="renderer.js?v=4"></script>
</body>
</html>
